[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csc370"
version = "0.3.0"
description = "Tooling for the CSC370 GPU inference routing database project"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Douglas MacGregor" },
    { name = "Mohammad Awwad" },
    { name = "Jarren Morris" },
]
dependencies = [
    "pandas>=2.0",
    "mysql-connector-python>=8.0",
    "matplotlib>=3.7",
]

[project.scripts]
csc370 = "csc370.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
